receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  # LLM traces → Phoenix (OpenInference 계측 전용)
  otlphttp/phoenix:
    endpoint: http://phoenix:6006
    tls:
      insecure: true

  # System logs → Loki (OTLP native, Loki 2.9+)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  # Metrics → Prometheus scrape endpoint
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: browser_agent
    resource_to_telemetry_conversion:
      enabled: true  # resource attributes를 metric labels로 변환

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/phoenix]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]

  telemetry:
    logs:
      level: warn
