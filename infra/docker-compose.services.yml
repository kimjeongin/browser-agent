include:
  - docker-compose.yml

services:
  gateway:
    build:
      context: ../services
      dockerfile: gateway/Dockerfile
    container_name: browser-agent-gateway
    ports: ["8000:8000"]
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ORCHESTRATOR_URL: http://orchestrator:8001
      KEYCLOAK_REALM_URL: http://localhost:8080/realms/browser-agent
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/browser-agent/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: browser-agent-extension
      BROWSER_TOOL_TIMEOUT: "60"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      otel-collector:
        condition: service_healthy

  orchestrator:
    build:
      context: ../services
      dockerfile: orchestrator/Dockerfile
    container_name: browser-agent-orchestrator
    expose: ["8001"]
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      ORCHESTRATOR_MODEL: qwen3:8b
      CHAT_AGENT_URL: http://chat-agent:8002
      BROWSER_AGENT_URL: http://browser-agent:8003
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_healthy

  chat-agent:
    build:
      context: ../services
      dockerfile: chat_agent/Dockerfile
    container_name: browser-agent-chat-agent
    expose: ["8002"]
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CHAT_MODEL: qwen3:8b
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_healthy

  browser-agent:
    build:
      context: ../services
      dockerfile: browser_agent/Dockerfile
    container_name: browser-agent-browser-agent
    expose: ["8003"]
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      BROWSER_MODEL: qwen3:8b
      PLANNER_MODEL: qwen3:8b
      GATEWAY_URL: http://gateway:8000
      REDIS_URL: redis://redis:6379
      BROWSER_TOOL_TIMEOUT: "65"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      gateway:
        condition: service_started
      otel-collector:
        condition: service_healthy
