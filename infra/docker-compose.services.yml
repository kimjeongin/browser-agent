include:
  - docker-compose.yml

services:
  gateway:
    build:
      context: ../services
      dockerfile: gateway/Dockerfile
    container_name: browser-agent-gateway
    ports: ["8000:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/browser_agent
      ORCHESTRATOR_URL: http://orchestrator:8001
      KEYCLOAK_REALM_URL: http://keycloak:8080/realms/browser-agent
      KEYCLOAK_AUDIENCE: browser-agent-extension
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  orchestrator:
    build:
      context: ../services
      dockerfile: ochestrator/Dockerfile
    container_name: browser-agent-orchestrator
    ports: ["8001:8001"]
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      ORCHESTRATOR_MODEL: llama3.1:8b
      CHAT_AGENT_URL: http://chat-agent:8002
      BROWSER_AGENT_URL: http://browser-agent:8003
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/browser_agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  chat-agent:
    build:
      context: ../services
      dockerfile: chat_agent/Dockerfile
    container_name: browser-agent-chat-agent
    ports: ["8002:8002"]
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CHAT_MODEL: qwen2.5:7b
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/browser_agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  browser-agent:
    build:
      context: ../services
      dockerfile: browser_agent/Dockerfile
    container_name: browser-agent-browser-agent
    ports: ["8003:8003"]
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      BROWSER_MODEL: qwen2.5:14b
      GATEWAY_URL: http://gateway:8000
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/browser_agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
