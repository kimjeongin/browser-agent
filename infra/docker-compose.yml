services:
  redis:
    image: redis:8-alpine
    container_name: browser-agent-redis
    ports: ["6379:6379"]
    command: redis-server --appendonly yes --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: browser-agent-postgres
    ports: ["5432:5432"]
    command: postgres -c log_min_messages=ERROR -c log_statement=none -c log_min_duration_statement=-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: browser_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: browser-agent-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001" --quiet
    volumes:
      - minio_data:/data
    healthcheck:
      # minio 이미지에는 curl이 있음
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: browser-agent-keycloak
    ports: ["8080:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password
      # Keycloak 26.x: hostname without protocol defaults to https://.
      # Provide the full URL so HTTP is used.
      KC_HOSTNAME: "http://localhost:8080"
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_HEALTH_ENABLED: true
      KC_LOG_LEVEL: INFO
      KC_PROXY_PROTOCOL: "none"
    # start-dev ignores KC_LOG_LEVEL for some loggers; override via CLI flag too.
    command: start-dev --import-realm 
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Keycloak 24+: health endpoint moved to management port (9000).
      # UBI9-minimal image has no curl/wget — use bash /dev/tcp instead.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/9000 2>/dev/null && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && timeout 5 cat <&3 | grep -qi UP || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  phoenix:
    image: arizephoenix/phoenix:version-13.10.0
    container_name: browser-agent-phoenix
    ports:
      - "6006:6006"
    environment:
      - PHOENIX_SQL_DATABASE_URL=postgresql://postgres:password@postgres:5432/phoenix
      - PHOENIX_WORKING_DIR=/mnt/data
      - PHOENIX_LOGGING_LEVEL=ERROR
      - PHOENIX_DB_LOGGING_LEVEL=error
      - PHOENIX_ACCESS_LOG=false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - phoenix_data:/mnt/data
    restart: unless-stopped
    healthcheck:
      # phoenix 이미지는 distroless — python만 사용 가능
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  loki:
    image: grafana/loki:3.3.2
    container_name: browser-agent-loki
    command: ["-config.file=/etc/loki/config.yaml", "-log.level=error"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/config.yaml
      - loki_data:/loki
    expose:
      - "3100"
    healthcheck:
      # loki 이미지는 distroless — /busybox/busybox만 사용 가능
      test: ["CMD", "/busybox/busybox", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.147.0
    container_name: browser-agent-otel-collector
    command: ["--config=/etc/otel/config.yaml", "--set=service::telemetry::logs::level=error"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    expose:
      - "8889"        # Prometheus metrics (내부 전용)
      - "13133"       # Health check (내부 전용)
    depends_on:
      phoenix:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      # otel-collector 이미지는 distroless — /otelcol-contrib 바이너리만 존재
      # health_check extension이 13133 포트를 열지만 TCP 체크 도구가 없으므로
      # 프로세스 시작 여부만 확인 (바이너리에 --help 실행)
      test: ["CMD", "/otelcol-contrib", "--help"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: browser-agent-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--log.level=error"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    healthcheck:
      # prometheus 이미지는 distroless — promtool로 헬스체크
      test: ["CMD", "promtool", "check", "healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.4.0
    container_name: browser-agent-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_LOG_LEVEL=error
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      # grafana 이미지에는 nc(netcat)만 있음
      test: ["CMD", "nc", "-z", "localhost", "3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  redis_data:
  postgres_data:
  minio_data:
  phoenix_data:
  loki_data:
  prometheus_data:
  grafana_data:
