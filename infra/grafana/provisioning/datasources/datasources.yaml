apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: "15s"

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # JSON 로그의 trace_id 필드 클릭 시 Phoenix로 바로 이동
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"([a-fA-F0-9]{32})"'
          url: "http://localhost:6006/trace/$${__value.raw}"
          urlDisplayLabel: "View in Phoenix"
