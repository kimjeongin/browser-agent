apiVersion: 1

providers:
  - name: 'Browser Agent'
    orgId: 1
    folder: 'Browser Agent'
    folderUid: 'browser-agent-folder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
