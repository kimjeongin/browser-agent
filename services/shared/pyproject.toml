[project]
name = "shared"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.133.0",
    "python-jose[cryptography]>=3.3.0",
    "cachetools>=5.3.0",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langchain-ollama>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
