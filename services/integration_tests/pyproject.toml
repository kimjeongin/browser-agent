[project]
name = "integration-tests"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "fastapi[standard]>=0.115",
    "sse-starlette>=2.0.0",
    "pydantic-settings>=2.0.0",
    "gateway",
    "shared",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
pythonpath = [".", "../gateway"]

[tool.uv.sources]
gateway = { path = "../gateway", editable = true }
shared = { path = "../shared", editable = true }
