# ArgoCD Application — Observability Stack
# (OTel Collector, Prometheus, Loki, Grafana, Phoenix)
# Sync policy: automated with pruning and self-healing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: browser-agent-observability
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: browser-agent
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: browser-agent

  source:
    repoURL: "https://github.com/kimjeongin/spica-browser-agent"
    targetRevision: main
    path: k8s/charts/observability
    helm:
      valueFiles:
        - values.yaml
      releaseName: observability

  destination:
    server: https://kubernetes.default.svc
    namespace: browser-agent-observability

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates/0/spec/storageClassName

  info:
    - name: "Description"
      value: "Observability: OTel Collector, Prometheus, Loki, Grafana, Phoenix"
