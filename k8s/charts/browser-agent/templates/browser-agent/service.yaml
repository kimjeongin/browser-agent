{{- if .Values.browserAgent.enabled }}
# The Service is named "browser-agent-svc" to avoid collision with the
# Deployment and chart name "browser-agent".
apiVersion: v1
kind: Service
metadata:
  name: browser-agent-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "browser-agent.componentLabels" (dict "component" "browser-agent" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.browserAgent.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "browser-agent.selectorLabels" (dict "component" "browser-agent" "context" .) | nindent 4 }}
{{- end }}
