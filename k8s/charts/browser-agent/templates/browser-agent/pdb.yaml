{{- if and .Values.browserAgent.enabled .Values.browserAgent.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: browser-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "browser-agent.componentLabels" (dict "component" "browser-agent" "context" .) | nindent 4 }}
spec:
  minAvailable: {{ .Values.browserAgent.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "browser-agent.selectorLabels" (dict "component" "browser-agent" "context" .) | nindent 6 }}
{{- end }}
