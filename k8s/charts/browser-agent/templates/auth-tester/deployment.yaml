{{- if .Values.authTester.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-tester
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "browser-agent.componentLabels" (dict "component" "auth-tester" "context" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "browser-agent.selectorLabels" (dict "component" "auth-tester" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "browser-agent.componentLabels" (dict "component" "auth-tester" "context" .) | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: false
      containers:
        - name: auth-tester
          # ealen/echo-server: echoes all request headers/body as JSON.
          # Ideal for verifying that Istio forwards the correct JWT claims.
          image: "{{ .Values.authTester.image.repository }}:{{ .Values.authTester.image.tag }}"
          imagePullPolicy: {{ .Values.authTester.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.authTester.service.port }}
              protocol: TCP
          env:
            # echo-server 0.9.2 listens on port 80 by default.
            # ENABLE__ flags turn on extra response sections.
            - name: ENABLE__ENVIRONMENT
              value: "true"
            - name: ENABLE__REQUEST
              value: "true"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.authTester.resources | nindent 12 }}
{{- end }}
