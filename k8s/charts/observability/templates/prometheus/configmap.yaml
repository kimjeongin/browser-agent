{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.componentLabels" (dict "component" "prometheus" "context" .) | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # OTel Collector prometheus exporter (all service metrics flow through here)
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.otelCollector.service.metricsPort }}"]
        metrics_path: /metrics

      # Redis exporter sidecar in the infra namespace
      - job_name: redis
        static_configs:
          - targets: ["redis.browser-agent-infra.svc.cluster.local:9121"]
{{- end }}
