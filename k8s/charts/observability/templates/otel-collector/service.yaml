{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.componentLabels" (dict "component" "otel-collector" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: {{ .Values.otelCollector.service.grpcPort }}
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.otelCollector.service.httpPort }}
      targetPort: otlp-http
      protocol: TCP
    - name: metrics
      port: {{ .Values.otelCollector.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
    - name: health
      port: {{ .Values.otelCollector.service.healthPort }}
      targetPort: health
      protocol: TCP
  selector:
    {{- include "observability.selectorLabels" (dict "component" "otel-collector" "context" .) | nindent 4 }}
{{- end }}
