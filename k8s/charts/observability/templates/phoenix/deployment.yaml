{{- if .Values.phoenix.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.componentLabels" (dict "component" "phoenix" "context" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "observability.selectorLabels" (dict "component" "phoenix" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observability.componentLabels" (dict "component" "phoenix" "context" .) | nindent 8 }}
    spec:
      # Phoenix (distroless) uses internal user 1000
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # Wait for PostgreSQL to be reachable before starting Phoenix.
      initContainers:
        - name: wait-for-postgresql
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until nc -z {{ .Values.phoenix.db.host }} {{ .Values.phoenix.db.port }}; do
                echo "waiting for postgresql..."; sleep 3;
              done
      containers:
        - name: phoenix
          image: "{{ .Values.phoenix.image.repository }}:{{ .Values.phoenix.image.tag }}"
          imagePullPolicy: {{ .Values.phoenix.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.phoenix.service.port }}
              protocol: TCP
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.phoenix.db.existingSecret }}
                  key: postgres-password
            - name: PHOENIX_SQL_DATABASE_URL
              value: "postgresql://{{ .Values.phoenix.db.username }}:$(POSTGRES_PASSWORD)@{{ .Values.phoenix.db.host }}:{{ .Values.phoenix.db.port }}/{{ .Values.phoenix.db.name }}"
            - name: PHOENIX_WORKING_DIR
              value: /mnt/data
            - name: PHOENIX_LOGGING_LEVEL
              value: ERROR
            - name: PHOENIX_DB_LOGGING_LEVEL
              value: error
            - name: PHOENIX_ACCESS_LOG
              value: "false"
            - name: PHOENIX_PORT
              value: "{{ .Values.phoenix.service.port }}"
            - name: PHOENIX_HOST
              value: "0.0.0.0"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.phoenix.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /mnt/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: phoenix-data
{{- end }}
